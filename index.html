<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Hoy - El Juego</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md mx-auto bg-[#121212] rounded-3xl shadow-2xl overflow-hidden border-4 border-gray-700 flex flex-col h-[90vh] max-h-[800px]">
        <header class="bg-[#2a2a2a] text-white p-3 flex items-center shadow-md z-10 flex-shrink-0">
            <div class="w-12 h-12 bg-gray-500 rounded-full flex items-center justify-center mr-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold">Padel hoy 🎾</h1>
                <p class="text-xs text-gray-300 truncate">Pancho, Tapir, Jose, Chino, Juancho</p>
            </div>
        </header>
        <main id="chat-window" class="flex-grow p-4 overflow-y-auto chat-bg flex flex-col space-y-4">
             <div class="bg-yellow-200 text-yellow-800 p-3 rounded-lg text-center text-sm shadow">
                <p>Presiona el botón de abajo para iniciar una nueva conversación y ver quién juega hoy.</p>
            </div>
        </main>
        <footer class="p-4 bg-[#1e1e1e] flex-shrink-0">
            <button id="start-chat-button" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center transition-transform transform hover:scale-105 shadow-lg">
                <span class="mr-2">¡Mandar 'Padel hoy'!</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
